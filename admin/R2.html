<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل وحالة الحجوزات</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0 0 5px 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .notice-count {
            background: #e8f4fd;
            border: 1px solid #bbe1fa;
            color: #0c5460;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .booking-card-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 14px;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 5px;
        }
        .detail-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }
        .detail-item span.label {
            color: #64748b;
            font-weight: bold;
        }
        .detail-item span.value {
            color: #1e293b;
            font-weight: bold;
        }
        .status-box {
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
        }
        .pending { background-color: #f39c12; color: white; }
        .accepted { background-color: #27ae60; color: white; }
        .rejected { background-color: #c0392b; color: white; }
        .expired { background-color: #7f8c8d; color: white; }

        .back-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            margin-top: 5px;
        }
        .back-btn:hover {
            background-color: #616a6b;
        }
    </style>
</head>
<body>
       <button type="button" id="backBtn" class="back-btn">العودة للرئيسية</button>
    <div class="container">
        <p class="title">تفاصيل وحالة حجوزاتك</p>
        
        <div id="resultContent">
            <p style="color: #666; font-size: 15px;">جاري جلب حجوزاتك من قاعدة البيانات...</p>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            let userId = urlParams.get("id");
            const resultContent = document.getElementById("resultContent");

            try {
                if (!userId) {
                    const latestUser = await db.collection("users")
                        .orderBy("createdAt", "desc")
                        .limit(1)
                        .get();

                    if (!latestUser.empty) {
                        userId = latestUser.docs[0].id;
                    }
                }

                if (!userId) {
                    resultContent.innerHTML = "<p style='color: #c0392b; font-weight: bold;'>عفواً، لا يوجد مستخدم محدد لعرض حجوزاته.</p>";
                    return;
                }

                // جلب كافة حجوزات هذا المستخدم دون استثناء
                const bookingSnapshot = await db.collection("bookings")
                    .where("userId", "==", userId)
                    .get();

                if (bookingSnapshot.empty) {
                    resultContent.innerHTML = "<p style='color: #555; font-size: 15px;'>لا يوجد لديك أي حجوزات مسجلة حتى الآن.</p>";
                } else {
                    let bookings = [];
                    bookingSnapshot.forEach(doc => {
                        bookings.push(doc.data());
                    });

                    // تصفية الحجوزات النشطة فقط (غير المنتهية أو الملغية إذا رغبت، أو عرض الكل بشكل تفصيلي)
                    const now = new Date();
                    let activeBookings = [];

                    bookings.forEach(b => {
                        let currentStatus = b.status || "قيد الانتظار";
                        
                        // فحص إذا مر 24 ساعة على الحجز المعلق
                        if (currentStatus === "pending" && b.createdAt) {
                            const createdAtDate = b.createdAt.toDate();
                            const hoursDiff = (now - createdAtDate) / (1000 * 60 * 60);
                            if (hoursDiff > 24) {
                                currentStatus = "منتهي";
                            }
                        }

                        // إذا أردت عرض الحجوزات النشطة أو التي لم تنتهي بعد
                        if (currentStatus !== "منتهي" && currentStatus !== "ملغي") {
                            b.calculatedStatus = currentStatus;
                            activeBookings.push(b);
                        }
                    });

                    if (activeBookings.length === 0) {
                        resultContent.innerHTML = "<p style='color: #555; font-size: 15px;'>ليس لديك حجوزات نشطة حالياً (يمكنك مراجعة الحجوزات السابقة).</p>";
                    } else {
                        let htmlOutput = `<div class="notice-count">📌 يوجد لديك (${activeBookings.length}) حجز نشط:</div>`;

                        activeBookings.forEach((bookingData, index) => {
                            const userName = bookingData.userName || "غير مسجل";
                            const userPhone = bookingData.userPhone || "غير مسجل";
                            const bookingDate = bookingData.date || "غير محدد";
                            
                            let displayTime = "غير محدد";
                            if (bookingData.slots && Array.isArray(bookingData.slots) && bookingData.slots.length > 0) {
                                const startStr = bookingData.slots[0].split(" - ")[0];
                                const endStr = bookingData.slots[bookingData.slots.length - 1].split(" - ")[1];
                                displayTime = `${startStr} - ${endStr}`;
                            } else if (bookingData.time) {
                                displayTime = bookingData.time;
                            }

                            const paymentMethod = bookingData.paymentMethod === "instapay" ? "InstaPay 💳" : "الدفع في الملعب 🏟️";
                            const duration = bookingData.duration || 1;
                            const amount = bookingData.totalAmount ? `${bookingData.totalAmount} جنيه` : `${duration * 200} جنيه`;
                            
                            const status = bookingData.calculatedStatus;
                            let statusClass = "pending";
                            let statusMsg = "⏳ قيد الانتظار (في انتظار المراجعة)";

                            if (status === "مقبول") {
                                statusClass = "accepted";
                                statusMsg = "✅ تم قبول الحجز بنجاح!";
                            } else if (status === "مرفوض") {
                                statusClass = "rejected";
                                statusMsg = "❌ تم رفض طلب الحجز.";
                            }

                            htmlOutput += `
                                <div class="booking-card-item">
                                    <div style="font-weight: bold; color: #2c3e50; font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 4px;">
                                        حجز رقم (${index + 1})
                                    </div>
                                    <div class="detail-item">
                                        <span class="label">📅 التاريخ:</span>
                                        <span class="value">${bookingDate}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="label">⏰ الساعات:</span>
                                        <span class="value" style="direction: ltr;">${displayTime}</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="label">⏳ المدة والمبلغ:</span>
                                        <span class="value">${duration} ساعة (${amount})</span>
                                    </div>
                                    <div class="detail-item">
                                        <span class="label">💳 الدفع:</span>
                                        <span class="value">${paymentMethod}</span>
                                    </div>
                                    <div class="status-box ${statusClass}">
                                        ${statusMsg}
                                    </div>
                                </div>
                            `;
                        });

                        resultContent.innerHTML = htmlOutput;
                    }
                }

                document.getElementById("backBtn").addEventListener("click", () => {
                    window.location.href = `tony.html?id=${userId}`;
                });

            } catch (error) {
                console.error("خطأ في جلب الحجوزات:", error);
                resultContent.innerHTML = `<p style='color: #c0392b;'>حدث خطأ أثناء تحميل الحجوزات: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
