<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Gaming</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0e14;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 95vh;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* صندوق الساعة واليوم بطابع الجيمينج */
        .gaming-clock-box {
            background: #151921;
            border: 2px solid #00f0ff;
            border-radius: 16px;
            padding: 25px 35px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.2);
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
        }

        .gaming-clock-box h3 {
            margin: 0 0 10px 0;
            color: #a0aabe;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .day-date {
            font-size: 22px;
            font-weight: 600;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            margin-bottom: 10px;
        }

        .clock-display {
            font-size: 36px;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.6);
            letter-spacing: 2px;
            font-family: monospace;
        }

        /* الكارت الرئيسي للأزرار */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 550px;
            background: #151921;
            padding: 35px;
            border-radius: 16px;
            border: 1px solid #2a2f3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: 800;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-management {
            background: linear-gradient(45deg, #00b4db, #0083b0);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.4);
        }

        .btn-time {
            background: linear-gradient(45deg, #7928ca, #ff0080);
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
        }

        .btn-profile {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            box-shadow: 0 0 15px rgba(56, 239, 125, 0.4);
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);
            filter: brightness(1.2);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <p class="title" id="welcomeText">جاري التحميل...</p>

    <div class="gaming-clock-box">
        <h3>الوقت والتاريخ الحالي</h3>
        <div class="day-date" id="currentDayDate">جاري التحديد...</div>
        <div class="clock-display" id="liveClock">00:00:00 --</div>
    </div>

    <div class="main-container">
       <form action="الاداره.html" method="get">
    <button type="submit" style="width: 100%;">إدارة الحجوزات</button>
</form>
        </form>
        
        <form action="time.html" method="get">
            <button type="submit" class="btn-time">مواعيد حجوزات</button>
        </form>
        
        <form action="profile.html" method="get">
            <button type="submit" class="btn-profile">Profile</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", async () => {
            const welcomeText = document.getElementById("welcomeText");
            const liveClockElement = document.getElementById("liveClock");
            const dayDateElement = document.getElementById("currentDayDate");

            // 1. تشغيل الساعة واليوم والتاريخ
            function updateClockAndDate() {
                const now = new Date();
                
                // عرض اليوم والتاريخ باللغة العربية
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                dayDateElement.textContent = now.toLocaleDateString('ar-EG', options);

                // عرض الوقت (ساعات، دقائق، ثواني)
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12;
                const formattedHours = String(hours).padStart(2, '0');

                liveClockElement.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }
            setInterval(updateClockAndDate, 1000);
            updateClockAndDate();

            // 2. جلب الترحيب بالأدمن من قاعدة البيانات
            try {
                const snapshot = await db.collection("admins")
                    .orderBy("createdAt", "desc")
                    .limit(1)
                    .get();

                if (!snapshot.empty) {
                    const data = snapshot.docs[0].data();
                    welcomeText.textContent = `أهلاً يا ${data.title || ""} ${data.name || ""}`;
                } else {
                    welcomeText.textContent = "أهلاً يا مشرفنا العزيز";
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات الأدمن:", error);
                welcomeText.textContent = "أهلاً يا مشرفنا العزيز";
            }
        });
    </script>
</body>
</html>
