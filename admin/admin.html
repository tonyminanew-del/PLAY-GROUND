<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin page</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .live-clock-box {
            background: white;
            color: #333;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .live-clock-box h3 {
            margin: 0 0 8px 0;
            color: #2980b9;
            font-size: 18px;
        }
        .live-clock-box p {
            margin: 5px 0;
            font-size: 15px;
        }
        .fullscreen-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: background 0.3s;
        }
        .fullscreen-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>
    <button class="fullscreen-btn" onclick="toggleFullScreen()">🖥️ وضع ملء الشاشة (Fullscreen)</button>

    <p class="title" id="welcomeText">جاري جلب البيانات من البيز...</p>

    <div class="live-clock-box">
        <h3>الوقت الحالي</h3>
        <p id="liveClock">--:--:-- --</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);">
     <form action="management.html" method="get">
            <button type="submit" class="btn-management">إدارة الحجوزات</button>
        </form>
        
        <form id="formTime" action="time.html" method="get">
            <button type="submit" style="width: 100%; background-color: #2980b9;">مواعيد حجوزات</button>
        </form>
        
        <form id="formProfile" action="profile.html" method="get">
            <button type="submit" style="width: 100%; background-color: #8e44ad;">profile</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // دالة وضع الفول سكرين (Full Screen)
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`خطأ في تفعيل وضع ملء الشاشة: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const welcomeText = document.getElementById("welcomeText");
            const liveClockElement = document.getElementById("liveClock");

            // 1. تشغيل الساعة الحية
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12;
                const formattedHours = String(hours).padStart(2, '0');

                liveClockElement.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // 2. قراءة بيانات الـ URL لجلب الحساب الدقيق من الفايربيس (البيز)
            const urlParams = new URLSearchParams(window.location.search);
            const adminId = urlParams.get("id");
            const adminPhone = urlParams.get("phone");
            let adminName = urlParams.get("name");

            try {
                let adminData = null;

                // أ) البحث في البيز بالـ ID أولاً
                if (adminId) {
                    const doc = await db.collection("admins").doc(adminId).get();
                    if (doc.exists) {
                        adminData = doc.data();
                    }
                }

                // ب) البحث في البيز بالهاتف إذا لم نجد بالـ ID
                if (!adminData && adminPhone) {
                    const snap = await db.collection("admins").where("phone", "==", adminPhone.trim()).get();
                    if (!snap.empty) {
                        adminData = snap.docs[0].data();
                    }
                }

                // ج) استخراج أحدث اسم وثيبيته
                if (adminData) {
                    adminName = adminData.name || adminData.adminName || adminData.fullName || adminName;
                }

                if (adminName && adminName !== "null" && adminName.trim() !== "") {
                    welcomeText.textContent = `أهلاً يا ${decodeURIComponent(adminName)}`;
                } else {
                    welcomeText.textContent = "أهلاً يا مشرفنا العزيز";
                }

            } catch (error) {
                console.error("خطأ جلب البيانات من البيز:", error);
                if (adminName) {
                    welcomeText.textContent = `أهلاً يا ${decodeURIComponent(adminName)}`;
                } else {
                    welcomeText.textContent = "أهلاً يا مشرفنا العزيز";
                }
            }

            // 3. ربط الـ Forms ببيانات البيز الصحيحة
            function setFormInputs(formId) {
                const form = document.getElementById(formId);
                if (form) {
                    if (adminName) {
                        const inputName = document.createElement("input");
                        inputName.type = "hidden";
                        inputName.name = "name";
                        inputName.value = adminName;
                        form.appendChild(inputName);
                    }
                    if (adminPhone) {
                        const inputPhone = document.createElement("input");
                        inputPhone.type = "hidden";
                        inputPhone.name = "phone";
                        inputPhone.value = adminPhone;
                        form.appendChild(inputPhone);
                    }
                    if (adminId) {
                        const inputId = document.createElement("input");
                        inputId.type = "hidden";
                        inputId.name = "id";
                        inputId.value = adminId;
                        form.appendChild(inputId);
                    }
                }
            }

            setFormInputs("formManagement");
            setFormInputs("formTime");
            setFormInputs("formProfile");
        });
    </script>
</body>
</html>
