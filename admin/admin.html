<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .welcome-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .live-clock-box {
            background: white;
            color: #333;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        .live-clock-box h3 {
            margin: 0 0 5px 0;
            color: #2980b9;
            font-size: 16px;
        }
        .live-clock-box p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #444;
        }
        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .menu-container button {
            width: 100%;
            padding: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .menu-container button:hover {
            opacity: 0.9;
        }
        .btn-management { background-color: #007bff; }
        .btn-profile { background-color: #8e44ad; }
        .btn-reports { background-color: #14967a; }
    </style>
</head>
<body>

    <h1 class="title welcome-title" id="welcomeText">جاري التحميل...</h1>

    <div class="live-clock-box">
        <h3>الوقت الحالي</h3>
        <p id="liveClock">--:--:-- --</p>
    </div>

    <div class="menu-container">
        <form action="managment.html" method="get">
            <button type="submit" class="btn-management">إدارة الحجوزات</button>
        </form>
        
        <form action="money.html" method="get">
            <button type="submit" class="btn-reports">التقارير</button>
        </form>

        <form action="profile.html" method="get">
            <button type="submit" class="btn-profile">الملف الشخصي</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", async () => {
            const welcomeText = document.getElementById("welcomeText");
            const liveClockElement = document.getElementById("liveClock");

            // 1. تشغيل الساعة الحية
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12; 
                const formattedHours = String(hours).padStart(2, '0');

                liveClockElement.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // 2. جلب الترحيب بالأدمن (اللقب + الاسم) من مجموعة admins
            try {
                const snapshot = await db.collection("admins").get();

                if (!snapshot.empty) {
                    // نجلب أول وثيقة أو يمكنك تعديلها حسب تصميم قاعدة البيانات لديك
                    const data = snapshot.docs[0].data();
                    
                    // التحقق من الحقول المحتملة للاسم واللقب
                    const title = data.title || data.prefix || data.jobTitle || "";
                    const name = data.name || data.fullName || data.userName || "";
                    
                    if (name) {
                        welcomeText.textContent = `أهلاً يا ${title} ${name}`.trim();
                    } else {
                        welcomeText.textContent = "أهلاً يا مشرفنا العزيز";
                    }
                } else {
                    welcomeText.textContent = "أهلاً يا مشرفنا العزيز";
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات الأدمن:", error);
                welcomeText.textContent = "أهلاً يا مشرفنا العزيز";
            }
        });
    </script>
</body>
</html>
