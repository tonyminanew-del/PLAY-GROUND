<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .admin-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            text-align: center;
        }
        .live-clock-box {
            background: white;
            color: #333;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        .live-clock-box h3 {
            margin: 0 0 8px 0;
            color: #2980b9;
            font-size: 17px;
        }
        .live-clock-box p {
            margin: 5px 0;
            font-size: 14px;
        }
        .admin-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .btn-management { background-color: #3498db; }
        .btn-management:hover { background-color: #2980b9; }
        
        .btn-profile { background-color: #8e44ad; }
        .btn-profile:hover { background-color: #732d91; }
        
        .btn-money { background-color: #16a085; }
        .btn-money:hover { background-color: #138d75; }

        .btn-ai { background-color: #d35400; }
        .btn-ai:hover { background-color: #ba4a00; }
    </style>
</head>
<body>

    <p class="admin-title" id="welcomeText">جاري التحميل...</p> 

    <div class="live-clock-box">
        <h3>الوقت الحالي</h3>
        <p id="liveClock">--:--:-- --</p>
    </div> 

    <div class="admin-card">
        <button type="button" class="btn-management" onclick="location.href='managment.html'">إدارة الحجوزات ⚙️</button>
        <button type="button" class="btn-money" onclick="location.href='money.html'">التقارير المالية 📊</button>
        <button type="button" class="btn-ai" onclick="location.href='ai.html'">🤖 المساعد الذكي (AI)</button>
        <button type="button" class="btn-profile" onclick="location.href='profile.html'">الملف الشخصي 👤</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script> 

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore(); 

        document.addEventListener("DOMContentLoaded", async () => {
            const welcomeText = document.getElementById("welcomeText");
            const liveClockElement = document.getElementById("liveClock");

            // تشغيل الساعة الحية
            function updateClock() {
                const now = new Date();
                let hours = now.getHours();
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                
                hours = hours % 12;
                hours = hours ? hours : 12; 
                const formattedHours = String(hours).padStart(2, '0'); 

                liveClockElement.textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
            }
            setInterval(updateClock, 1000);
            updateClock(); 

            try {
                const urlParams = new URLSearchParams(window.location.search);
                let adminId = urlParams.get("id");
                let adminData = null;

                // لو الرابط فيه ID هات المستند بتاعه مباشرة
                if (adminId) {
                    const docRef = await db.collection("admins").doc(adminId).get();
                    if (docRef.exists) {
                        adminData = docRef.data();
                    }
                }

                // لو مفيش ID في الرابط، هات أول مستند جوه جدول admins تلقائياً
                if (!adminData) {
                    const snapshot = await db.collection("admins").limit(1).get();
                    if (!snapshot.empty) {
                        adminData = snapshot.docs[0].data();
                    }
                }

                if (adminData) {
                    // سحب الحقول الحقيقية الموجودة في قاعدة البيانات لديك (title و username)
                    const title = adminData.title || "";
                    const name = adminData.username || adminData.name || "المشرف";
                    
                    welcomeText.textContent = `أهلاً يا ${title} ${name}`.trim();
                } else {
                    welcomeText.textContent = "لا توجد بيانات مسجلة للمشرف";
                }

            } catch (error) {
                console.error("خطأ في جلب بيانات الأدمن:", error);
                welcomeText.textContent = "خطأ في الاتصال بقاعدة البيانات";
            }
        });
    </script>
</body>
</html>
