<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 500px; height: 90vh; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
        
        .chat-header { background: #ffffff; color: #333; padding: 16px 20px; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #eaeaea; display: flex; align-items: center; gap: 10px; }
        .chat-header span { width: 10px; height: 10px; background: #28a745; border-radius: 50%; display: inline-block; }

        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background: #fafbfc; }
        .message { padding: 12px 16px; border-radius: 14px; max-width: 85%; line-height: 1.7; word-wrap: break-word; font-size: 0.95rem; }
        .user-msg { background: #007bff; color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .ai-msg { background: #ffffff; color: #333; align-self: flex-end; border-bottom-left-radius: 4px; border: 1px solid #eaeaea; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        
        .input-area { padding: 15px; background: #ffffff; border-top: 1px solid #eaeaea; display: flex; gap: 10px; align-items: center; }
        .input-wrapper { flex: 1; display: flex; align-items: center; background: #f1f3f4; border-radius: 24px; padding: 8px 16px; border: 1px solid transparent; transition: all 0.3s; }
        .input-wrapper:focus-within { background: #ffffff; border-color: #007bff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        .input-wrapper input { flex: 1; border: none; background: transparent; outline: none; font-size: 0.95rem; color: #333; padding: 4px; }
        
        .send-btn { background: #007bff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; transition: background 0.2s; }
        .send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span></span> Tony AI 🤖
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message ai-msg">أهلاً بك! أنا Tony AI، مساعدك الذكي. كيف يمكنني خدمتك داخل البرنامج اليوم؟</div>
    </div>
    
    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="اكتب مشكلتك أو استفسارك هنا..." onkeypress="if(event.key==='Enter') sendMsg()">
        </div>
        <button class="send-btn" onclick="sendMsg()" title="إرسال">▲</button>
    </div>
</div>

<script>
const now = new Date();
const currentTime = now.toLocaleString('ar-EG', { dateStyle: 'full', timeStyle: 'medium' });

let chatHistory = [
    { 
      role: "system", 
      content: `أنت مساعد ذكي ومحترف يدعى "Tony AI"، وموجود داخل البرنامج لمساعدة المستخدم، ووقت الجهاز الحالي هو: ${currentTime}.
      
      معلومات أساسية ثابتة لا تتغير:
      - اسم المبرمج الذي قام بتطويرك وبرمجتك هو: المبرمج توني مينا مجدي.
      - رقم الدعم الفني المتاح هو: 01202821961.
      
      تعليمات صارمة جداً وممنوع مخالفتها:
      1. اللغة: اكتب جميع الردود باللغة العربية الفصحى الخالصة فقط. يُمنع منعاً باتاً ظهور أي حروف يابانية أو صينية أو أجنبية أو رموز غير مفهومة نهائياً.
      2. هوية المبرمج: إذا سألك أي شخص عن المبرمج أو من قام برمجتك، أجب فوراً وبكل وضوح: "المبرمج توني مينا مجدي".
      3. حل المشكلات: قدم الحلول والخطوات للمشاكل مباشرة من داخل البرنامج وبشكل واضح وبسيط.
      4. خيار تسجيل الخروج: لا تذكر أو تقترح خيار تسجيل الخروج والدخول مرة أخرى إلا في حالة وجود مشكلة تقنية مستعصية كحل أخير فقط.` 
    }
];

async function sendMsg() {
    const input = document.getElementById('userInput');
    const msg = input.value.trim();
    if(!msg) return;

    const chatBox = document.getElementById('chatBox');
    
    // عرض رسالة المستخدم
    chatBox.innerHTML += `<div class="message user-msg">${msg}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    chatHistory.push({ role: "user", content: msg });

    // مؤشر الكتابة
    const loadingId = 'loading-' + Date.now();
    chatBox.innerHTML += `<div class="message ai-msg" id="${loadingId}">Tony AI يكتب الرد...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    const apiKey = "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"; 

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: chatHistory
            })
        });

        const data = await response.json();
        
        if(data.choices && data.choices.length > 0) {
            const reply = data.choices[0].message.content;
            document.getElementById(loadingId).innerText = reply;
            chatHistory.push({ role: "assistant", content: reply });
        } else {
            // إظهار الخطأ القادم من الـ API لوالد
            document.getElementById(loadingId).innerText = "خطأ من الخادم: " + JSON.stringify(data);
        }
    } catch (e) {
        document.getElementById(loadingId).innerText = "خطأ في الاتصال بالشبكة: " + e.message;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
