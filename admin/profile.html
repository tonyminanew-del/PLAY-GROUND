<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <p class="title">الملف الشخصي للمشرف</p>

    <div style="display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);">
        
        <div style="font-size: 16px; color: #333; line-height: 1.8;">
            <p><strong>اللقب:</strong> <span id="profileTitle">جاري التحميل...</span></p>
            <p><strong>الاسم:</strong> <span id="profileName">جاري التحميل...</span></p>
            <p><strong>رقم الهاتف:</strong> <span id="profilePhone">جاري التحميل...</span></p>
        </div>

        <button id="logoutBtn" style="background-color: #e74c3c; width: 100%; margin-top: 10px;">تسجيل خروج</button>
        
        <button id="backBtn" style="background-color: #7f8c8d; width: 100%;">العودة لوحة التحكم</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            // قراءة بياناتك من الـ URL أو الـ LocalStorage للحفاظ عليها
            let adminId = urlParams.get("id") || localStorage.getItem("savedAdminId");
            let adminName = urlParams.get("name") || localStorage.getItem("savedAdminName");
            let adminPhone = urlParams.get("phone") || localStorage.getItem("savedAdminPhone");

            try {
                let foundData = null;

                // 1. البحث عنك أنت تحديداً بالـ ID في الفايربيس
                if (adminId) {
                    const doc = await db.collection("admins").doc(adminId).get();
                    if (doc.exists) {
                        foundData = doc.data();
                    }
                }

                // 2. إذا لم يجد بالـ ID، يبحث برقم هاتفك أنت فقط
                if (!foundData && adminPhone) {
                    const snap = await db.collection("admins").where("phone", "==", adminPhone.trim()).get();
                    if (!snap.empty) {
                        foundData = snap.docs[0].data();
                    }
                }

                // 3. عرض بياناتك
                if (foundData) {
                    document.getElementById("profileTitle").textContent = foundData.title || "مشرف";
                    document.getElementById("profileName").textContent = foundData.name || adminName || "-";
                    document.getElementById("profilePhone").textContent = foundData.phone || adminPhone || "-";
                    
                    // تحديث التخزين المحلي ببياناتك الصحيحة
                    if (foundData.name) localStorage.setItem("savedAdminName", foundData.name);
                    if (foundData.phone) localStorage.setItem("savedAdminPhone", foundData.phone);
                } else {
                    document.getElementById("profileTitle").textContent = "مشرف";
                    document.getElementById("profileName").textContent = adminName || "-";
                    document.getElementById("profilePhone").textContent = adminPhone || "-";
                }

            } catch (error) {
                console.error("خطأ في جلب بيانات البروفايل:", error);
                document.getElementById("profileTitle").textContent = "مشرف";
                document.getElementById("profileName").textContent = adminName || "-";
                document.getElementById("profilePhone").textContent = adminPhone || "-";
            }

            // زر العودة لوحة التحكم مع نقل بياناتك أنت فقط
            document.getElementById("backBtn").addEventListener("click", () => {
                const queryParams = `?name=${encodeURIComponent(adminName || '')}&phone=${encodeURIComponent(adminPhone || '')}&id=${encodeURIComponent(adminId || '')}`;
                window.location.href = `admin.html${queryParams}`;
            });

            // زر تسجيل الخروج وتفريغ البيانات
            const logoutBtn = document.getElementById("logoutBtn");
            logoutBtn.addEventListener("click", () => {
                localStorage.removeItem("savedAdminName");
                localStorage.removeItem("savedAdminPhone");
                localStorage.removeItem("savedAdminId");
                alert("تم تسجيل الخروج بنجاح.");
                window.location.href = "../index.html";
            });
        });
    </script>
</body>
</html>
