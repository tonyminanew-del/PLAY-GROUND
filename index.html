<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - ملعب كنيسة الشهيد العظيم مارجرجس</title>
    <style>
        /* تهيئة الصفحة الأساسية وتوسيط المحتوى */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            position: relative; /* ضروري لضبط موقع الخلفية الزائفة */
            overflow: hidden; /* يمنع ظهور أشرطة التمرير الزائدة */
        }

        /* إنشاء طبقة الخلفية الشفافة المعزولة */
        body::before {
            content: "";
            background-image: url('Screenshot_20260729-171726_WhatsApp.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.35; /* درجة الشفافية (يمكنك تعديلها من 0 إلى 1) */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* يضمن بقاء الصورة خلف صندوق تسجيل الدخول */
        }

        /* صندوق تسجيل الدخول */
        .login-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* تنسيق الجزء السفلي والروابط */
        .login-footer {
            margin-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .login-footer hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .login-footer a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>اهلا ببرنامج ملعب كنيسة الشهيد العظيم مارجرجس</h2>
        
        <form id="loginForm">
            <input type="text" id="userInput" placeholder="أدخل الاسم " required>
            <button type="submit">دخول</button>
        </form>
    </div>

    <div class="login-footer">
        <hr>
        <a href="work.html">لدي حساب بالفعل</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const inputVal = document.getElementById('userInput').value.trim();

            if (inputVal === 'TONY@CONTROL2026') {
                window.location.href = 'admin/sign.html'; 
            } else {
                window.location.href = 'user.html';
            }
        });
    </script>
</body>
</html>
