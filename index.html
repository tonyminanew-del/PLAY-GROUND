<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="stylesheet" href="image.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملعب كنيسة الشهيد العظيم مارجرجس</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative; 
        }

        .login-box {
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 20px;
            line-height: 1.4;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }

        /* زر المستخدم */
        .btn-user {
            background-color: #007bff;
            color: white;
        }

        .btn-user:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* زر الأدمن */
        .btn-admin {
            background-color: #28a745;
            color: white;
        }

        .btn-admin:hover {
            background-color: #1e7e34;
            transform: translateY(-2px);
        }

        .login-footer {
            margin-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        .login-footer hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .login-footer a {
            color: #007bff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>أهلاً بك في برنامج ملعب كنيسة الشهيد العظيم مارجرجس</h2>
        
        <div class="buttons-container">
            <a href="user/user.name.html" class="btn btn-user">تسجيل الدخول كمستخدم</a>
            
            <a href="admin/sign.html" class="btn btn-admin">تسجيل الدخول كـ أدمن</a>
        </div>
    </div>

    <div class="login-footer">
        <hr>
        <a href="work.html">لدي حساب بالفعل</a>
    </div>

</body>
</html>
