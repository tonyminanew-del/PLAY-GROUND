<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الحجوزات السابقة</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            margin-top: 20px;
        }
        h2 {
            color: #1e3c72;
            text-align: center;
            margin: 0 0 10px 0;
            font-size: 22px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }
        .booking-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .booking-card:hover {
            transform: translateY(-2px);
        }
        .card-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .card-row span:first-child {
            color: #64748b;
            font-weight: bold;
        }
        .card-row span:last-child {
            color: #0f172a;
            font-weight: bold;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-expired {
            background: #fee2e2;
            color: #991b1b;
        }
        .badge-cancelled {
            background: #fef3c7;
            color: #92400e;
        }
        .no-data {
            text-align: center;
            color: #64748b;
            padding: 30px;
            font-size: 15px;
        }
        .back-btn {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.3s;
            margin-top: 10px;
        }
        .back-btn:hover {
            background-color: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📁 أرشيف الحجوزات السابقة</h2>
        
        <div id="historyList">
            <div class="no-data">جاري جلب السجل...</div>
        </div>

        <button type="button" id="backBtn" class="back-btn">العودة للرئيسية 🔙</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function getUserIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const userId = getUserIdFromURL();
            const historyListContainer = document.getElementById("historyList");

            if (!userId) {
                historyListContainer.innerHTML = '<div class="no-data">لم يتم تحديد المستخدم</div>';
                return;
            }

            try {
                const snapshot = await db.collection("bookings")
                    .where("userId", "==", userId)
                    .get();

                if (snapshot.empty) {
                    historyListContainer.innerHTML = '<div class="no-data">لا توجد حجوزات سابقة مسجلة</div>';
                    return;
                }

                const now = new Date();
                let oldBookingsHTML = "";
                let count = 0;

                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    const docId = doc.id;
                    let isOldOrFinished = false;

                    // فحص إذا مر 24 ساعة وباقي معلق (pending)
                    if (data.status === "pending" && data.createdAt) {
                        const createdAtDate = data.createdAt.toDate();
                        const hoursDiff = (now - createdAtDate) / (1000 * 60 * 60);
                        if (hoursDiff > 24) {
                            isOldOrFinished = true;
                        }
                    }

                    // فحص إذا انتهى موعد اليوم تاريخياً
                    if (data.date) {
                        const bookingDateObj = new Date(data.date);
                        if (bookingDateObj < new Date(now.toDateString())) {
                            isOldOrFinished = true;
                        }
                    }

                    if (data.status === "منتهي" || data.status === "ملغي" || isOldOrFinished) {
                        count++;
                        const bDate = data.date || "غير محدد";
                        const bTime = data.slots ? data.slots.join("، ") : (data.time || "غير محدد");
                        const bAmount = data.totalAmount || data.duration * 200 || 200;
                        const statusText = data.status === "ملغي" ? "ملغي" : "منتهي / انتهت المهلة";
                        const badgeClass = data.status === "ملغي" ? "badge-cancelled" : "badge-expired";

                        oldBookingsHTML += `
                            <div class="booking-card">
                                <div class="card-row">
                                    <span>📅 التاريخ:</span>
                                    <span>${bDate}</span>
                                </div>
                                <div class="card-row">
                                    <span>⏰ الوقت:</span>
                                    <span>${bTime}</span>
                                </div>
                                <div class="card-row">
                                    <span>💰 المبلغ:</span>
                                    <span>${bAmount} جنيه</span>
                                </div>
                                <div class="card-row">
                                    <span>📌 الحالة:</span>
                                    <span class="badge ${badgeClass}">${statusText}</span>
                                </div>
                            </div>
                        `;
                    }
                }

                if (count > 0) {
                    historyListContainer.innerHTML = oldBookingsHTML;
                } else {
                    historyListContainer.innerHTML = '<div class="no-data">لا توجد حجوزات سابقة أو منتهية حتى الآن</div>';
                }

            } catch (error) {
                console.error("خطأ في جلب الحجوزات القديمة:", error);
                historyListContainer.innerHTML = '<div class="no-data">حدث خطأ أثناء تحميل السجل</div>';
            }

            document.getElementById("backBtn").addEventListener("click", () => {
                window.location.href = `tony.html?id=${userId}`;
            });
        });
    </script>
</body>
</html>
