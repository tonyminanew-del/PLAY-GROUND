<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الرئيسية للمستخدم</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin: 0 0 5px 0;
        }
        .info-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            text-align: right;
            font-size: 14px;
            color: #495057;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .info-box span {
            font-weight: bold;
            color: #2980b9;
        }
        .clock-box {
            font-size: 15px;
            font-weight: bold;
            color: #e67e22;
            background: #fdf3e7;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #f5cba7;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-booking {
            background-color: #27ae60;
        }
        .btn-booking:hover {
            background-color: #219653;
        }
        .btn-result {
            background-color: #e67e22;
        }
        .btn-result:hover {
            background-color: #d35400;
        }
        /* زر الحجوزات السابقة بتصميم مميز */
        .btn-history {
            background-color: #34495e;
        }
        .btn-history:hover {
            background-color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 id="welcomeUser">جاري تحميل الاسم...</h2>

        <div class="clock-box" id="liveClock">جاري تحديث الوقت...</div>

        <div class="info-box">
            <div>📅 <strong>تاريخ اليوم:</strong> <span id="currentDateText">جاري الحساب...</span></div>
            <div>⚽ <strong>حجزك القادم:</strong> <span id="nextBookingText">جاري البحث عن حجز...</span></div>
        </div>

        <div class="btn-group">
            <button type="button" id="profileBtn">الملف الشخصي </button>
            <button type="button" id="bookingBtn" class="btn-booking">احجز الملعب</button>
            <button type="button" id="resultBtn" class="btn-result">متابعة حالة الحجز</button>
            <button type="button" id="historyBtn" class="btn-history">📁 السجل والحجوزات السابقة</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedHours = String(hours).padStart(2, '0');

            const clockElement = document.getElementById("liveClock");
            if (clockElement) {
                clockElement.textContent = `⏰ الوقت: ${formattedHours}:${minutes}:${seconds}${ampm}`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.addEventListener("DOMContentLoaded", async () => {
            const welcomeElement = document.getElementById("welcomeUser");
            const currentDateText = document.getElementById("currentDateText");
            const nextBookingText = document.getElementById("nextBookingText");

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const todayFormatted = new Date().toLocaleDateString('ar-EG', options);
            if (currentDateText) currentDateText.textContent = todayFormatted;

            const urlParams = new URLSearchParams(window.location.search);
            let currentUserId = urlParams.get("id");

            try {
                let userData = null;

                if (currentUserId) {
                    const userDoc = await db.collection("users").doc(currentUserId).get();
                    if (userDoc.exists) {
                        userData = userDoc.data();
                    }
                }

                if (!userData) {
                    const snapshot = await db.collection("users").limit(1).get();
                    if (!snapshot.empty) {
                        currentUserId = snapshot.docs[0].id;
                        userData = snapshot.docs[0].data();
                    }
                }

                if (userData) {
                    const realName = userData.name || userData.fullName || userData.userName || userData.username || userData.adminName || userData.firstName;
                    welcomeElement.textContent = realName ? `أهلاً يا ${realName}` : `أهلاً بك`;
                } else {
                    welcomeElement.textContent = "أهلاً يا صديقي";
                }

                // فحص الحجوزات ونقل المنتهية أو التي مر عليها 24 ساعة دون قبول
                if (currentUserId) {
                    const bookingSnapshot = await db.collection("bookings")
                        .where("userId", "==", currentUserId)
                        .get();

                    if (!bookingSnapshot.empty) {
                        const now = new Date();
                        let activeBooking = null;

                        for (const doc of bookingSnapshot.docs) {
                            const bData = doc.data();
                            const bId = doc.id;
                            let isExpiredOrOld = false;

                            // 1. التحقق إذا مر 24 ساعة على الحجز وهو معلق (pending)
                            if (bData.status === "pending" && bData.createdAt) {
                                const createdAtDate = bData.createdAt.toDate();
                                const hoursDiff = (now - createdAtDate) / (1000 * 60 * 60);
                                if (hoursDiff > 24) {
                                    isExpiredOrOld = true;
                                }
                            }

                            // 2. التحقق إذا انتهى تاريخ الحجز (الوقت مر)
                            if (bData.date) {
                                const bookingDateObj = new Date(bData.date);
                                if (bookingDateObj < new Date(now.toDateString())) {
                                    isExpiredOrOld = true;
                                }
                            }

                            // إذا انتهى، نغير حالته في القاعدة إلى "منتهي" أو "ملغي"
                            if (isExpiredOrOld && bData.status !== "منتهي" && bData.status !== "ملغي") {
                                await db.collection("bookings").doc(bId).update({ status: "منتهي" });
                            } else if (!isExpiredOrOld && !activeBooking && bData.status !== "منتهي" && bData.status !== "ملغي") {
                                activeBooking = bData;
                            }
                        }

                        if (activeBooking) {
                            const bDate = activeBooking.date || "غير محدد";
                            const slotDisplay = activeBooking.slots ? activeBooking.slots[0] : (activeBooking.time || "غير محدد");
                            const bStatus = activeBooking.status || "قيد الانتظار";
                            
                            nextBookingText.innerHTML = `${bDate} (${slotDisplay}) - <span style="color: ${bStatus === 'مقبول' ? '#27ae60' : '#e67e22'}">${bStatus}</span>`;
                        } else {
                            nextBookingText.textContent = "لا يوجد حجز قادم نشط";
                        }
                    } else {
                        nextBookingText.textContent = "لا يوجد حجوزات مسجلة";
                    }
                }

            } catch (error) {
                console.error("خطأ في جلب البيانات: ", error);
                welcomeElement.textContent = "أهلاً بك";
                nextBookingText.textContent = "تعذر جلب الحجز";
            }

            // ربط الأزرار مع الحفاظ على الـ ID
            document.getElementById("profileBtn").addEventListener("click", () => {
                window.location.href = currentUserId ? `profile.html?id=${currentUserId}` : "profile.html";
            });

            document.getElementById("bookingBtn").addEventListener("click", () => {
                window.location.href = currentUserId ? `حجز .html?id=${currentUserId}` : "حجز .html";
            });

            document.getElementById("resultBtn").addEventListener("click", () => {
                window.location.href = currentUserId ? `result.html?id=${currentUserId}` : "result.html";
            });

            document.getElementById("historyBtn").addEventListener("click", () => {
                window.location.href = currentUserId ? `n.html?id=${currentUserId}` : "n.html";
            });
        });
    </script>
</body>
</html>
