<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Homepage</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .welcome-title {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .info-box {
            background: #fdf3e7;
            border: 1px solid #f5cba7;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #d35400;
        }
        .details-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
            text-decoration: none;
        }
        .btn-profile { background-color: #3498db; }
        .btn-book { background-color: #2ecc71; }
        .btn-status { background-color: #e67e22; }
    </style>
</head>
<body>

    <div class="container">
        <div class="welcome-title" id="welcomeText">أهلاً بك</div>

        <div class="info-box" id="liveClock">⏰ الوقت: --:--:-- --</div>

        <div class="details-box">
            <div>📅 <strong>تاريخ اليوم:</strong> <span id="currentDateText">جاري التحميل...</span></div>
            <div>⚽ <strong>حجزك القادم:</strong> <span id="nextBookingText">لا يوجد حجوزات مسجلة</span></div>
        </div>

        <button class="btn btn-profile" onclick="goToPage('profile.html')">الملف الشخصي (Profile)</button>
        <button class="btn btn-book" onclick="goToPage('حجز .html')">احجز الملعب</button>
        <button class="btn btn-status" onclick="goToPage('result.html')">متابعة حالة الحجز</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // تحديث الساعة الحية
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'مساءً' : 'صباحاً';
            hours = hours % 12 || 12;

            document.getElementById("liveClock").textContent = `⏰ الوقت: ${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // متغيرات الحساب
        let userId = "";
        let userName = "";
        let userPhone = "";

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            
            userId = urlParams.get("id") || localStorage.getItem("savedUserId");
            userName = urlParams.get("name") || localStorage.getItem("savedUserName");
            userPhone = urlParams.get("phone") || localStorage.getItem("savedUserPhone");

            const welcomeText = document.getElementById("welcomeText");
            const currentDateText = document.getElementById("currentDateText");

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            currentDateText.textContent = new Date().toLocaleDateString('ar-EG', options);

            // جلب وتثبيت بيانات الحساب فقط
            if (userId) {
                try {
                    const userDoc = await db.collection("users").doc(userId).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        userName = userData.name || userData.userName || userName;
                        userPhone = userData.phone || userPhone;

                        localStorage.setItem("savedUserId", userId);
                        localStorage.setItem("savedUserName", userName);
                        localStorage.setItem("savedUserPhone", userPhone);
                    }
                } catch (e) {
                    console.error("خطأ قراءة بيانات المستخدم:", e);
                }
            }

            if (userName && userName !== "null") {
                welcomeText.textContent = `أهلاً يا ${decodeURIComponent(userName)}`;
            } else {
                welcomeText.textContent = "أهلاً بك";
            }
        });

        // دالة تحويل الصفحات مع الحفاظ الكامل على البيانات
        function goToPage(targetPage) {
            const queryParams = `?id=${encodeURIComponent(userId || '')}&name=${encodeURIComponent(userName || '')}&phone=${encodeURIComponent(userPhone || '')}`;
            window.location.href = targetPage + queryParams;
        }
    </script>
</body>
</html>
