<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e1e2e 0%, #2a2a40 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: rgba(43, 43, 61, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        .title {
            color: #00d2d3;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #c8d6e5;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #485460;
            border-radius: 8px;
            background-color: #1e1e2e;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d2d3;
            box-shadow: 0 0 8px rgba(0, 210, 211, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00d2d3 0%, #00a8a9 100%);
            color: #1e1e2e;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 211, 0.4);
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }

        /* إخفاء النموذج الرئيسي في البداية */
        #adminForm {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <p class="title">تسجيل دخول لوحة التحكم</p>

        <div id="accessStep">
            <div class="form-group">
                <label for="accessPassword">أدخل كلمة المرور لدخول اللوحة:</label>
                <input type="password" id="accessPassword" placeholder="اكتب كلمة السر هنا...">
            </div>
            <button type="button" id="verifyBtn">تأكيد كلمة السر</button>
        </div>

        <form id="adminForm">
            <div class="form-group">
                <label for="adminUsername">اسم المستخدم (Username):</label>
                <input type="text" id="adminUsername" required placeholder="اكتب اسم المستخدم...">
            </div>

            <div class="form-group">
                <label for="adminPassword">كلمة السر الخاصة بك (Password):</label>
                <input type="password" id="adminPassword" required placeholder="اكتب كلمة السر...">
            </div>

            <div class="form-group">
                <label for="adminPhone">رقم الهاتف:</label>
                <input type="tel" id="adminPhone" required placeholder="اكتب رقم هاتفك...">
            </div>

            <div class="form-group">
                <label for="adminChurch">اسم الكنيسة:</label>
                <input type="text" id="adminChurch" required placeholder="اكتب اسم الكنيسة...">
            </div>

            <div class="form-group">
                <label for="adminTitle">اللقب / الوصف:</label>
                <select id="adminTitle">
                    <option value="اخ">اخ</option>
                    <option value="تاسوني">تاسوني</option>
                    <option value="ابونا">ابونا</option>
                </select>
            </div>

            <button type="submit">دخول</button>
        </form>

        <div id="message"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.addEventListener("DOMContentLoaded", () => {
            const accessStep = document.getElementById("accessStep");
            const accessPassword = document.getElementById("accessPassword");
            const verifyBtn = document.getElementById("verifyBtn");
            const adminForm = document.getElementById("adminForm");
            const messageDiv = document.getElementById("message");

            // 1. التحقق من كلمة السر الرئيسية لإظهار الأسئلة
            verifyBtn.addEventListener("click", () => {
                const enteredKey = accessPassword.value.trim();

                if (enteredKey === "TONY@CONTROL2026") {
                    accessStep.style.display = "none";
                    adminForm.style.display = "block";
                    messageDiv.textContent = "";
                } else {
                    messageDiv.style.color = "#ff7675";
                    messageDiv.textContent = "كلمة السر غير صحيحة!";
                }
            });

            // 2. معالجة إرسال البيانات بعد إظهار الأسئلة
            adminForm.addEventListener("submit", async (event) => {
                event.preventDefault();

                const username = document.getElementById("adminUsername").value.trim();
                const password = document.getElementById("adminPassword").value.trim();
                const phone = document.getElementById("adminPhone").value.trim();
                const church = document.getElementById("adminChurch").value.trim(); // جلب اسم الكنيسة
                const title = document.getElementById("adminTitle").value;

                if (username === "" || password === "" || phone === "" || church === "") {
                    messageDiv.style.color = "#ff7675";
                    messageDiv.textContent = "يرجى ملء جميع الحقول المطلوبة!";
                    return;
                }

                messageDiv.style.color = "#00d2d3";
                messageDiv.textContent = "جاري التحقق من البيانات...";

                try {
                    const snapshot = await db.collection("admins")
                        .where("username", "==", username)
                        .get();

                    if (!snapshot.empty) {
                        messageDiv.style.color = "#ff7675";
                        messageDiv.textContent = "اسم المستخدم هذا مُستخدم بالفعل، اختر اسماً آخر!";
                    } else {
                        // إرسال البيانات بما فيها حقل الكنيسة (church) إلى Firebase
                        await db.collection("admins").add({
                            username: username,
                            password: password,
                            phone: phone,
                            church: church,
                            title: title,
                            createdAt: new Date()
                        });

                        localStorage.setItem("adminUsername", username);
                        localStorage.setItem("adminTitle", title);

                        messageDiv.style.color = "#55efc4";
                        messageDiv.textContent = "تم التسجيل بنجاح! جاري التوجيه...";

                        setTimeout(() => {
                            window.location.href = `admin.html?username=${encodeURIComponent(username)}`;
                        }, 1000);
                    }
                } catch (error) {
                    console.error("خطأ أثناء الاتصال بقاعدة البيانات: ", error);
                    messageDiv.style.color = "#ff7675";
                    messageDiv.textContent = "حدث خطأ في الاتصال بقاعدة البيانات!";
                }
            });
        });
    </script>
</body>
</html>
