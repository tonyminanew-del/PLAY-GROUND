<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0c20 0%, #1e1b4b 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .dialog-box {
      background: rgba(30, 27, 75, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .dialog-titlebar {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #6366f1;
      text-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
    }

    .input-group {
      margin-bottom: 15px;
      text-align: right;
    }

    .input-field {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      background-color: rgba(15, 12, 32, 0.5);
      color: #fff;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .input-field::placeholder {
      color: #94a3b8;
    }

    .input-field:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
      background-color: rgba(15, 12, 32, 0.8);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
      transition: all 0.3s ease;
    }

    .primary {
      background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
      background: linear-gradient(90deg, #4f46e5 0%, #4338ca 100%);
    }

    .primary:active {
      transform: translateY(0);
    }

    #message {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
      min-height: 20px;
      transition: color 0.3s ease;
    }
  </style>
</head>
<body> 

  <div class="dialog-box">
    <div class="dialog-titlebar">
      <span>إنشاء حساب جديد</span>
    </div> 

    <form id="registerForm" action="tony.html" method="POST">
      <div class="dialog-content">
        <div class="input-group">
          <input 
            type="text" 
            id="username" 
            name="username"
            class="input-field" 
            placeholder="اسم المستخدم" 
            required
          >
        </div>
        <div class="input-group">
          <input 
            type="password" 
            id="password" 
            name="password"
            class="input-field" 
            placeholder="كلمة السر" 
            required
          >
        </div>
        <div class="input-group">
          <input 
            type="tel" 
            id="phone" 
            name="phone"
            class="input-field" 
            placeholder="رقم الهاتف (اختياري)" 
          >
        </div>
      </div> 

      <div class="dialog-buttons">
        <button type="submit" class="btn primary">تسجيل حساب</button>
      </div>
    </form> 

    <div id="message"></div>
  </div> 

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; 

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
      authDomain: "marygrgs.firebaseapp.com",
      projectId: "marygrgs",
      storageBucket: "marygrgs.firebasestorage.app",
      messagingSenderId: "866893606556",
      appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
      measurementId: "G-YRH69L594N"
    }; 

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app); 

    const registerForm = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message'); 

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault(); 

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const phoneInput = document.getElementById('phone').value.trim(); 

      messageDiv.style.color = "#818cf8";
      messageDiv.textContent = "جاري التحقق من اسم المستخدم..."; 

      try {
        const usersRef = collection(db, "users"); 

        // 1. التحقق إذا كان الاسم موجوداً بالفعل في الكولكشن
        const checkQuery = query(usersRef, where("name", "==", usernameInput));
        const querySnapshot = await getDocs(checkQuery); 

        if (!querySnapshot.empty) {
          // الاسم موجود بالفعل - يرفض التسجيل
          messageDiv.style.color = "#f87171";
          messageDiv.textContent = "اسم المستخدم هذا مُستخدم بالفعل، اختر اسماً آخر!";
        } else {
          // 2. حفظ البيانات في Firebase
          await addDoc(usersRef, {
            name: usernameInput,
            password: passwordInput,
            phone: phoneInput || "",
            createdAt: new Date()
          }); 

          messageDiv.style.color = "#4ade80";
          messageDiv.textContent = "تم التسجيل بنجاح! جاري التوجيه..."; 

          // 3. التحويل إلى صفحة tony.html بعد النجاح
          setTimeout(() => {
            window.location.href = "tony.html";
          }, 1000);
        } 

      } catch (error) {
        console.error("Error adding user: ", error);
        messageDiv.style.color = "#f87171";
        messageDiv.textContent = "حدث خطأ أثناء الاتصال بقاعدة البيانات!";
      }
    });
  </script>
</body>
</html>
