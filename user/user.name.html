<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: #090d16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.2) 0px, transparent 50%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .dialog-box {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 35px 28px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(56, 189, 248, 0.1);
      width: 100%;
      max-width: 380px;
      text-align: center;
      position: relative;
    }

    .dialog-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      border-radius: 0 0 5px 5px;
      box-shadow: 0 0 10px #38bdf8;
    }

    .dialog-titlebar {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 25px;
      color: #38bdf8;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-field {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background-color: rgba(15, 23, 42, 0.9);
      color: #f1f5f9;
      font-size: 15px;
      transition: all 0.25s ease-in-out;
    }

    .input-field::placeholder {
      color: #64748b;
    }

    .input-field:focus {
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
      background-color: #0f172a;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 800;
      transition: all 0.25s ease;
    }

    .primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
      background: linear-gradient(135deg, #38bdf8 0%, #1d4ed8 100%);
    }

    .primary:active {
      transform: translateY(0);
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      font-weight: 700;
      min-height: 20px;
    }
  </style>
</head>
<body> 

  <div class="dialog-box">
    <div class="dialog-titlebar">
      <span>إنشاء حساب جديد</span>
    </div> 

    <form id="registerForm">
      <div class="dialog-content">
        <div class="input-group">
          <input 
            type="text" 
            id="username" 
            name="username"
            class="input-field" 
            placeholder="اسم المستخدم" 
            required
          >
        </div>

        <div class="input-group">
          <input 
            type="password" 
            id="password" 
            name="password"
            class="input-field" 
            placeholder="كلمة السر" 
            required
          >
        </div>

        <div class="input-group">
          <input 
            type="text" 
            id="church" 
            name="church"
            class="input-field" 
            placeholder="اسم الكنيسة التابع لها" 
            required
          >
        </div>

        <div class="input-group">
          <input 
            type="tel" 
            id="phone" 
            name="phone"
            class="input-field" 
            placeholder="رقم الهاتف" 
          >
        </div>
      </div> 

      <div class="dialog-buttons">
        <button type="submit" class="btn primary">تسجيل حساب</button>
      </div>
    </form> 

    <div id="message"></div>
  </div> 

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"; 

    const firebaseConfig = {
      apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
      authDomain: "marygrgs.firebaseapp.com",
      projectId: "marygrgs",
      storageBucket: "marygrgs.firebasestorage.app",
      messagingSenderId: "866893606556",
      appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
      measurementId: "G-YRH69L594N"
    }; 

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app); 

    const registerForm = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message'); 

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault(); 

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const churchInput = document.getElementById('church').value.trim();
      const phoneInput = document.getElementById('phone').value.trim(); 

      messageDiv.style.color = "#38bdf8";
      messageDiv.textContent = "جاري التحقق والتسجيل..."; 

      try {
        const usersRef = collection(db, "users"); 

        // 1. التحقق من وجود الاسم سابقاً
        const checkQuery = query(usersRef, where("name", "==", usernameInput));
        const querySnapshot = await getDocs(checkQuery); 

        if (!querySnapshot.empty) {
          messageDiv.style.color = "#f87171";
          messageDiv.textContent = "اسم المستخدم هذا مُستخدم بالفعل، اختر اسماً آخر!";
        } else {
          // 2. إرسال البيانات
          const docRef = await addDoc(usersRef, {
            name: usernameInput,
            password: passwordInput,
            church: churchInput,
            phone: phoneInput || "",
            createdAt: serverTimestamp()
          }); 

          // 3. حفظ ID المستخدم الجديد في ذاكرة المتصفح
          localStorage.setItem("loggedInUserId", docRef.id);

          messageDiv.style.color = "#4ade80";
          messageDiv.textContent = "تم التسجيل بنجاح! جاري التوجيه..."; 

          // 4. التوجيه وتمرير الـ ID لصفحة tony.html
          setTimeout(() => {
            window.location.href = `tony.html?id=${docRef.id}`;
          }, 1000);
        } 

      } catch (error) {
        console.error("Error adding user: ", error);
        messageDiv.style.color = "#f87171";
        messageDiv.textContent = "حدث خطأ أثناء الاتصال بقاعدة البيانات!";
      }
    });
  </script>
</body>
</html>
