<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز الملعب</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            color: #333;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
            margin: 0 0 5px 0;
        }
        .user-info-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 15px;
            text-align: center;
            color: #2c3e50;
        }
        .user-info-card p {
            margin: 4px 0;
            font-size: 15px;
        }
        .user-info-card strong {
            color: #27ae60;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            text-align: right;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #27ae60;
        }
        
        .payment-section {
            border-top: 2px dashed #eee;
            padding-top: 12px;
            margin-top: 5px;
        }
        .payment-title {
            font-weight: bold;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: right;
        }
        .payment-options {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .payment-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background: #f8fafc;
            color: #333;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .payment-btn.active {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }
        .instapay-box {
            display: none;
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #334155;
            margin-top: 8px;
        }
        .store-links {
            display: flex;
            gap: 6px;
            margin: 8px 0;
        }
        .store-btn {
            flex: 1;
            padding: 8px;
            background: #0f172a;
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
            font-weight: bold;
        }
        .phone-badge {
            display: block;
            text-align: center;
            background: #e0f2fe;
            color: #0369a1;
            font-weight: bold;
            padding: 6px;
            border-radius: 6px;
            direction: ltr;
            margin: 6px 0;
            font-size: 15px;
        }

        .notice-banner {
            background: #fff3cd;
            border: 2px solid #ffeba2;
            border-radius: 8px;
            padding: 10px;
            margin-top: 10px;
            text-align: center;
        }
        .notice-banner p {
            margin: 0;
            color: #856404;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.5;
        }
        .notice-banner span {
            display: block;
            font-size: 15px;
            color: #d39e00;
            margin-top: 4px;
        }

        button[type="submit"] {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #219653;
        }
        .back-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }
        .back-btn:hover {
            background-color: #616a6b;
        }
    </style>
</head>
<body>

    <div class="container">
        <p class="title">حجز موعد للملعب</p>

        <div class="user-info-card">
            <p>الاسم: <strong id="displayUserName">جاري جلب البيانات...</strong></p>
            <p>رقم الهاتف: <strong id="displayUserPhone">جاري جلب البيانات...</strong></p>
        </div>
        
        <form id="bookingForm">
            <div class="input-group">
                <label for="bookingDate">تاريخ الحجز:</label>
                <input type="date" id="bookingDate" required>
            </div>

            <div class="input-group">
                <label for="bookingDuration">مدة الحجز (عدد الساعات):</label>
                <select id="bookingDuration" required>
                    <option value="1" selected>ساعة واحدة (200 ج)</option>
                    <option value="2">ساعتان (400 ج)</option>
                    <option value="3">3 ساعات (600 ج)</option>
                    <option value="4">4 ساعات (800 ج)</option>
                    <option value="5">5 ساعات (1000 ج)</option>
                    <option value="6">6 ساعات (1200 ج)</option>
                    <option value="7">7 ساعات (1400 ج)</option>
                    <option value="8">8 ساعات (1600 ج)</option>
                    <option value="9">9 ساعات (1800 ج)</option>
                    <option value="10">10 ساعات (2000 ج)</option>
                </select>
            </div>

            <div class="input-group">
                <label for="bookingTime">وقت الحجز المتوفر:</label>
                <select id="bookingTime" required>
                    <option value="">يرجى اختيار التاريخ أولاً</option>
                </select>
            </div>

            <div class="payment-section">
                <div class="payment-title" id="paymentTitle">طريقة الدفع (رسوم الحجز: 200 ج):</div>
                <div class="payment-options">
                    <button type="button" class="payment-btn active" id="btnCash" onclick="setPaymentMethod('cash')">🏟️ الدفع في الملعب</button>
                    <button type="button" class="payment-btn" id="btnInsta" onclick="setPaymentMethod('instapay')">💳 InstaPay</button>
                </div>

                <div id="instapayBox" class="instapay-box">
                    <p style="margin: 0; font-weight: bold; color: #0369a1;">فتح المتجر:</p>
                    <div class="store-links">
                        <a href="https://play.google.com/store" target="_blank" class="store-btn">Google Play Store 🎮</a>
                    </div>
                    <p style="margin: 5px 0 0 0;" id="instapayAmountText">حول <strong>200 جنيه</strong> على الرقم:</p>
                    <span class="phone-badge">+20 12 00890168</span>

                    <div class="notice-banner">
                        <p>⚠️ <strong>خطوة هامة جداً:</strong></p>
                        <span>📸 عند فتح الواتساب، يُرجى إرفاق صورة إيصال التحويل (Screenshot) مع الرسالة لتأكيد الحجز.</span>
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" style="margin-top: 10px;">تأكيد الحجز وتوجيه للواتساب 🚀</button>
            <button type="button" id="backBtn" class="back-btn">العودة للرئيسية</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let fetchedUserName = "";
        let fetchedUserPhone = "";
        let userId = ""; 
        let selectedPaymentMethod = 'cash';
        let pricePerHour = 200;
        let selectedDuration = 1;
        let totalAmount = 200;
        let currentBookedSlots = [];

        const allTimeSlots = [
            "03:00 PM - 04:00 PM",
            "04:00 PM - 05:00 PM",
            "05:00 PM - 06:00 PM",
            "06:00 PM - 07:00 PM",
            "07:00 PM - 08:00 PM",
            "08:00 PM - 09:00 PM",
            "09:00 PM - 10:00 PM",
            "10:00 PM - 11:00 PM",
            "11:00 PM - 12:00 AM"
        ];

        // 1. جلب البيانات من البيز
        async function fetchUserDataFromFirebase() {
            const nameElem = document.getElementById("displayUserName");
            const phoneElem = document.getElementById("displayUserPhone");

            try {
                const snapshot = await db.collection("bookings")
                    .orderBy("createdAt", "desc")
                    .limit(1)
                    .get();

                if (!snapshot.empty) {
                    const doc = snapshot.docs[0];
                    const data = doc.data();
                    userId = doc.id;
                    fetchedUserName = data.userName || "غير محدد";
                    fetchedUserPhone = data.userPhone || "";

                    nameElem.innerText = fetchedUserName;
                    phoneElem.innerText = fetchedUserPhone || "غير محدد";
                } else {
                    nameElem.innerHTML = "<span style='color:red;'>لا توجد بيانات مسجلة في البيز</span>";
                    phoneElem.innerHTML = "<span style='color:red;'>لا توجد بيانات مسجلة في البيز</span>";
                }
            } catch (err) {
                console.error("خطأ أثناء جلب البيانات من البيز:", err);
                nameElem.innerHTML = "<span style='color:red;'>خطأ في جلب البيانات</span>";
                phoneElem.innerHTML = "<span style='color:red;'>خطأ في جلب البيانات</span>";
            }
        }

        function setPaymentMethod(method) {
            selectedPaymentMethod = method;
            const instapayBox = document.getElementById('instapayBox');
            const btnCash = document.getElementById('btnCash');
            const btnInsta = document.getElementById('btnInsta');

            if (method === 'instapay') {
                instapayBox.style.display = 'block';
                btnInsta.classList.add('active');
                btnCash.classList.remove('active');
            } else {
                instapayBox.style.display = 'none';
                btnCash.classList.add('active');
                btnInsta.classList.remove('active');
            }
        }

        // 2. تحديث قائمة الأوقات المتاحة
        function renderAvailableTimes() {
            const timeSelect = document.getElementById("bookingTime");
            const dateInput = document.getElementById("bookingDate");

            if (!dateInput.value) {
                timeSelect.innerHTML = '<option value="">يرجى اختيار التاريخ أولاً</option>';
                return;
            }

            timeSelect.innerHTML = '<option value="">اختر الوقت المناسب</option>';
            let availableCount = 0;

            for (let i = 0; i < allTimeSlots.length; i++) {
                let canBook = true;
                
                if (i + selectedDuration > allTimeSlots.length) {
                    canBook = false;
                } else {
                    for (let j = 0; j < selectedDuration; j++) {
                        if (currentBookedSlots.includes(allTimeSlots[i + j])) {
                            canBook = false;
                            break;
                        }
                    }
                }

                if (canBook) {
                    const option = document.createElement("option");
                    option.value = i;
                    
                    let startStr = allTimeSlots[i].split(" - ")[0];
                    let endStr = allTimeSlots[i + selectedDuration - 1].split(" - ")[1];
                    
                    option.textContent = `${startStr} - ${endStr}`;
                    timeSelect.appendChild(option);
                    availableCount++;
                }
            }

            if (availableCount === 0) {
                timeSelect.innerHTML = '<option value="">لا توجد مواعيد متاحة لهذه المدة في هذا اليوم</option>';
            }
        }

        // 3. جلب المواعيد المحجوزة باليوم
        async function fetchBookedSlots(selectedDate) {
            const timeSelect = document.getElementById("bookingTime");
            timeSelect.innerHTML = '<option value="">جاري تحميل المواعيد المتاحة...</option>';
            
            currentBookedSlots = [];

            try {
                const snapshot = await db.collection("bookings")
                    .where("date", "==", selectedDate)
                    .where("status", "==", "confirmed") 
                    .get();

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.slots && Array.isArray(data.slots)) {
                        currentBookedSlots.push(...data.slots);
                    }
                });

                renderAvailableTimes();
            } catch (error) {
                console.error("خطأ في جلب المواعيد المحجوزة:", error);
                renderAvailableTimes();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchUserDataFromFirebase();

            const dateInput = document.getElementById("bookingDate");
            const durationSelect = document.getElementById("bookingDuration");
            const bookingForm = document.getElementById("bookingForm");

            const today = new Date().toISOString().split('T')[0];
            dateInput.setAttribute('min', today);

            const handleDateChange = () => {
                const selectedDate = dateInput.value;
                if (selectedDate) {
                    fetchBookedSlots(selectedDate);
                } else {
                    renderAvailableTimes();
                }
            };

            dateInput.addEventListener("change", handleDateChange);
            dateInput.addEventListener("input", handleDateChange);

            durationSelect.addEventListener("change", (e) => {
                selectedDuration = parseInt(e.target.value);
                totalAmount = selectedDuration * pricePerHour;
                
                document.getElementById("paymentTitle").innerText = `طريقة الدفع (رسوم الحجز: ${totalAmount} ج):`;
                document.getElementById("instapayAmountText").innerHTML = `حول <strong>${totalAmount} جنيه</strong> على الرقم:`;
                
                renderAvailableTimes();
            });

            // 4. كتابة الرسالة كما بالنموذج المطلوب وتمريرها مباشرة عبر wa.me
            bookingForm.addEventListener("submit", (e) => {
                e.preventDefault();

                const bookingDate = dateInput.value;
                const timeIndex = document.getElementById("bookingTime").value;

                if (!bookingDate) {
                    alert("يرجى اختيار تاريخ الحجز أولاً");
                    return;
                }

                if (timeIndex === "") {
                    alert("يرجى اختيار وقت الحجز المناسب");
                    return;
                }

                const startIndex = parseInt(timeIndex);
                const displayStartTime = allTimeSlots[startIndex].split(" - ")[0];
                const displayEndTime = allTimeSlots[startIndex + selectedDuration - 1].split(" - ")[1];
                const fullTimeDisplay = `${displayStartTime} - ${displayEndTime}`;

                const paymentText = selectedPaymentMethod === 'instapay' ? 'InstaPay' : 'الدفع في الملعب';

                let messageText = `⚽ *حجز جديد - ملعب مارجرجس* ⚽%0A%0A` +
                                  `👤 *الاسم:* ${encodeURIComponent(fetchedUserName || 'غير محدد')}%0A` +
                                  `📞 *رقم الهاتف:* ${encodeURIComponent(fetchedUserPhone || 'غير محدد')}%0A` +
                                  `📅 *التاريخ:* ${bookingDate}%0A` +
                                  `⏰ *الوقت:* ${encodeURIComponent(fullTimeDisplay)}%0A` +
                                  `💳 *طريقة الدفع:* ${encodeURIComponent(paymentText)}%0A` +
                                  `💰 *المبلغ:* ${totalAmount} جنيه`;

                const whatsappNumber = "201200890168";
                const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${messageText}`;

                window.open(whatsappUrl, '_blank');

                setTimeout(() => {
                    window.location.href = `tony.html?id=${userId}`;
                }, 1000);
            });

            // زر العودة
            document.getElementById("backBtn").addEventListener("click", () => {
                window.location.href = `tony.html?id=${userId}`;
            });
        });
    </script>
</body>
</html>
