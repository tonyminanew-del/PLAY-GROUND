<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Portal - Login</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #0b0c10;
            background-image: radial-gradient(circle at 50% 50%, #1f2833 0%, #0b0c10 100%);
            color: #c5c6c7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: #1f2833;
            border: 2px solid #66fcf1;
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.3), inset 0 0 15px rgba(102, 252, 241, 0.1);
            border-radius: 15px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            position: relative;
        }

        .welcome-title {
            color: #66fcf1;
            font-weight: 900;
            font-size: 24px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.5);
        }

        .step {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-size: 16px;
            color: #c5c6c7;
            text-align: right;
            font-weight: 700;
        }

        input {
            background-color: #0b0c10;
            border: 1px solid #45a29e;
            color: #fff;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 12px rgba(102, 252, 241, 0.8);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            background: linear-gradient(45deg, #45a29e, #66fcf1);
            color: #0b0c10;
            font-weight: 900;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
            flex: 1;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.8);
        }

        button.btn-danger {
            background: linear-gradient(45deg, #ff4b2b, #ff416c);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 65, 108, 0.4);
        }

        button.btn-danger:hover {
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.8);
        }

        p.question {
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .loading-text {
            color: #66fcf1;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="headerTitle" class="welcome-title">CONTROL PORTAL</h2>

        <div id="step-phone" class="step">
            <label for="phoneInput">رقم الهاتف:</label>
            <input type="text" id="phoneInput" placeholder="أدخل رقمك المسجل">
            <button onclick="checkUserType()">دخول</button>
            <span id="loader" class="loading-text">جاري البحث في قاعدة البيانات...</span>
        </div>

        <div id="step-password" class="step" style="display: none;">
            <label for="passInput">كلمة السر الخاصة بالـ Admin:</label>
            <input type="password" id="passInput" placeholder="••••••••">
            <button onclick="verifyAdminPassword()">تأكيد كلمة السر</button>
        </div>

        <div id="step-confirm-name" class="step" style="display: none;">
            <p id="nameQuestion" class="question"></p>
            <div class="btn-group">
                <button onclick="confirmIdentity(true)">نعم</button>
                <button class="btn-danger" onclick="confirmIdentity(false)">لا</button>
            </div>
        </div>

        <div id="step-extra-info" class="step" style="display: none;">
            <label for="fullNameInput">ادخل الاسم واللقب (أخ / تاسوني / أبونا):</label>
            <input type="text" id="fullNameInput" placeholder="مثال: أبونا متأس / أخ مينا">
            <button onclick="submitExtraInfo()">حفظ ومتابعة</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUserData = null;
        let currentDocId = "";
        let currentCollection = "";
        let currentPhoneVal = "";

        async function checkUserType() {
            currentPhoneVal = document.getElementById('phoneInput').value.trim();
            const loader = document.getElementById('loader');

            if (!currentPhoneVal) {
                alert("يرجى إدخال رقم الهاتف!");
                return;
            }

            loader.style.display = "block";

            try {
                let foundData = null;

                // 1. البحث في admins بالمطابقة التامة للرقم
                const adminSnapshot = await db.collection('admins').get();
                adminSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (String(data.phone).trim() === currentPhoneVal || doc.id.trim() === currentPhoneVal) {
                        foundData = data;
                        currentDocId = doc.id;
                        currentCollection = 'admins';
                    }
                });

                if (foundData) {
                    loader.style.display = "none";
                    currentUserData = foundData;
                    document.getElementById('step-phone').style.display = 'none';
                    document.getElementById('step-password').style.display = 'block';
                    return;
                }

                // 2. البحث في users بالمطابقة التامة للرقم
                const userSnapshot = await db.collection('users').get();
                userSnapshot.forEach(doc => {
                    const data = doc.data();
                    if (String(data.phone).trim() === currentPhoneVal || doc.id.trim() === currentPhoneVal) {
                        foundData = data;
                        currentDocId = doc.id;
                        currentCollection = 'users';
                    }
                });

                loader.style.display = "none";

                if (foundData) {
                    currentUserData = foundData;
                    const userName = currentUserData.name || currentUserData.fullName || "المستخدم";
                    const role = (currentUserData.role || '').toLowerCase();

                    if (role === 'admin') {
                        document.getElementById('step-phone').style.display = 'none';
                        document.getElementById('step-password').style.display = 'block';
                    } else {
                        alert(`أهلاً يا ${userName}`);
                        const nameParam = encodeURIComponent(userName);
                        const phoneParam = encodeURIComponent(currentPhoneVal);
                        
                        window.location.href = `user/tony.html?name=${nameParam}&phone=${phoneParam}`;
                    }
                } else {
                    alert("هذا الرقم غير مسجل في النظام!");
                }

            } catch (error) {
                loader.style.display = "none";
                console.error("Firestore Error:", error);
                alert("حدث خطأ أثناء الاتصال بالفايرستور: " + error.message);
            }
        }

        function verifyAdminPassword() {
            const password = document.getElementById('passInput').value;
            const ADMIN_PASS = "TONY@CONTROL2026";

            if (password === ADMIN_PASS) {
                const userName = currentUserData.name || currentUserData.fullName || "المستخدم";
                
                document.getElementById('headerTitle').innerText = `أهلاً يا ${userName}`;
                document.getElementById('nameQuestion').innerText = `هل أنت ${userName}؟`;

                document.getElementById('step-password').style.display = 'none';
                document.getElementById('step-confirm-name').style.display = 'block';
            } else {
                alert("كلمة السر غير صحيحة!");
            }
        }

        function confirmIdentity(isCorrectName) {
            const userName = currentUserData.name || currentUserData.fullName || "المستخدم";
            const nameParam = encodeURIComponent(userName);
            const phoneParam = encodeURIComponent(currentPhoneVal);

            if (isCorrectName) {
                window.location.href = `admin/admin.html?name=${nameParam}&phone=${phoneParam}`;
            } else {
                document.getElementById('step-confirm-name').style.display = 'none';
                document.getElementById('step-extra-info').style.display = 'block';
            }
        }

        async function submitExtraInfo() {
            const fullName = document.getElementById('fullNameInput').value.trim();
            
            if (fullName !== "") {
                try {
                    await db.collection(currentCollection).doc(currentDocId).update({
                        name: fullName
                    });
                    
                    alert("تم حفظ البيانات بنجاح!");
                    const nameParam = encodeURIComponent(fullName);
                    const phoneParam = encodeURIComponent(currentPhoneVal);
                    
                    window.location.href = `admin/admin.html?name=${nameParam}&phone=${phoneParam}`;
                } catch (error) {
                    console.error(error);
                    alert("حدث خطأ أثناء حفظ البيانات!");
                }
            } else {
                alert("يرجى إدخال الاسم واللقب بشكل صحيح.");
            }
        }
    </script>
</body>
</html>
