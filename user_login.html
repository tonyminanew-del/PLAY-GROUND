<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - CONTROL PORTAL</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .login-box {
            background: #1e293b;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            border: 2px solid #38bdf8;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 22px;
            letter-spacing: 1px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            text-align: right;
            font-size: 15px;
            color: #cbd5e1;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2dd4bf;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { background-color: #14b8a6; }
        .status-msg {
            margin-top: 15px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>CONTROL PORTAL</h2>
        
        <form id="loginForm">
            <label>رقم الهاتف:</label>
            <input type="text" id="phoneInput" placeholder="أدخل رقم الهاتف" required>
            <button type="submit" id="submitBtn">دخول</button>
        </form>

        <div class="status-msg" id="statusMsg">جاري البحث في قاعدة البيانات...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGM0xBeu0wc2JV_4hgymDMDi1jlltf8SI",
            authDomain: "marygrgs.firebaseapp.com",
            projectId: "marygrgs",
            storageBucket: "marygrgs.firebasestorage.app",
            messagingSenderId: "866893606556",
            appId: "1:866893606556:web:d2b7bab1c8dcd8fd038759",
            measurementId: "G-YRH69L594N"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phoneVal = document.getElementById('phoneInput').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');

            if (!phoneVal) return;

            try {
                submitBtn.disabled = true;
                statusMsg.textContent = "جاري التحقق من الحساب...";

                // البحث برقم الهاتف في قاعدة البيانات
                const snapshot = await db.collection("users")
                    .where("phone", "==", phoneVal)
                    .get();

                if (!snapshot.empty) {
                    const doc = snapshot.docs[0];
                    const userData = doc.data();
                    const userId = doc.id;
                    const userName = userData.name || userData.userName || "مستخدم";

                    // حفظ البيانات الخاصة بك فقط لمنع تغيرها
                    localStorage.setItem("savedUserId", userId);
                    localStorage.setItem("savedUserName", userName);
                    localStorage.setItem("savedUserPhone", phoneVal);

                    alert(`أهلاً يا ${userName}`);

                    // التوجيه مع تمرير كل البيانات
                    window.location.href = `user/tony.html?id=${encodeURIComponent(userId)}&name=${encodeURIComponent(userName)}&phone=${encodeURIComponent(phoneVal)}`;
                } else {
                    alert("رقم الهاتف غير مسجل!");
                    submitBtn.disabled = false;
                    statusMsg.textContent = "";
                }
            } catch (err) {
                console.error("خطأ الدخول:", err);
                alert("حدث خطأ في الاتصال بقاعدة البيانات");
                submitBtn.disabled = false;
                statusMsg.textContent = "";
            }
        });
    </script>
</body>
</html>
